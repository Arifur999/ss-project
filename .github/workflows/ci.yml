name: CI

# Quality gate: runs on every push to main and on every pull request into
# main. A red check here means don't merge/deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Errors fail the build; the ~80 pre-existing warnings (unused vars,
      # react-hooks/exhaustive-deps) are a separate cleanup task, not part of
      # this deployment setup, so this intentionally omits --max-warnings 0
      # (unlike the package.json "lint" script, which stays strict for
      # anyone running it locally).
      - name: Lint (errors only)
        run: npx eslint . --ext ts,tsx --report-unused-disable-directives

      # queryEngine.test.ts pins down what a query means in this app - strict
      # equality, ilike as a plain contains, null matching undefined. Every
      # figure on every page comes out of those rules, so a change to them has
      # to fail here rather than reach the server.
      - name: Tests
        run: npm test

      - name: Type check + build
        run: npm run build

      # Hand the built SPA to the deploy job so it is never built twice.
      - uses: actions/upload-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: dist
          path: dist
          retention-days: 1

  # Publishes the built SPA to the VPS only after quality-check is green, and
  # only for pushes to main. nginx serves this folder directly, so copying the
  # files IS the deploy - no container rebuild needed.
  deploy:
    needs: quality-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - name: Authorise SSH to the VPS
        run: |
          mkdir -p ~/.ssh
          # tr -d '\r': a key copied on Windows carries CRLF line endings, and
          # OpenSSH rejects the file outright. It does that before opening any
          # connection, so the server logs nothing at all and the failure looks
          # like a network problem three steps later.
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Say so here, plainly, instead of letting rsync fail with something
          # that reads like the server is unreachable.
          ssh-keygen -y -P "" -f ~/.ssh/id_ed25519 > /dev/null 2>&1 \
            || { echo "::error::VPS_SSH_KEY is not a usable private key. Copy it again in full, including the -----BEGIN and -----END lines."; exit 1; }

      # --delete removes files from old builds (hashed asset names would other-
      # wise pile up forever). Trailing slashes matter: copy the CONTENTS of
      # dist into the served folder.
      # Retried, because a single SSH hiccup should not leave a good build
      # undeployed. This step has failed on its own more than once with the code
      # already green in quality-check, and the only remedy was pushing an empty
      # commit to run the whole pipeline again - during which the site keeps
      # serving the previous bundle and whatever was fixed stays unfixed.
      #
      # rsync is idempotent, so a retry after a partial transfer simply resumes:
      # --delete removes what is no longer in dist, and re-sending an identical
      # file is a checksum comparison rather than a copy. ConnectTimeout keeps a
      # dead connection from burning the whole job's time budget.
      - name: Upload the build
        run: |
          for attempt in 1 2 3; do
            if rsync -az --delete \
                -e "ssh -i ~/.ssh/id_ed25519 -o ConnectTimeout=20 -p ${{ secrets.VPS_SSH_PORT || 22 }}" \
                dist/ \
                "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/Hatim/dist/"; then
              echo "Uploaded on attempt $attempt"
              exit 0
            fi
            echo "Upload attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "Upload failed three times - the VPS is unreachable, not the build"
          exit 1

      # Asked over the public address, the same way a customer reaches it, so
      # DNS, the certificate and nginx all have to be working for this to pass.
      # (Not localhost: port 80 there only redirects now.)
      - name: Verify the site answers
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://furnify.softech.agency/)
          if [ "$code" != "200" ]; then echo "Site returned HTTP $code"; exit 1; fi
          echo "Site is up (HTTP $code)"
